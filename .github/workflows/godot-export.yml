# Ad Maiorem Dei Gloriam
name: "Export to web"
on:
  label:
    types:
      - created

env:
  GODOT_VERSION: 4.7
  EXPORT_NAME: A-Journey-Of-A-Robot
  PROJECT_PATH: .

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ "$HOME" != "/root" ] && [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then cp -r "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/; fi
      - name: Web Build
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
  deploy:
    name: Upload to web
    runs-on: ubuntu-latest
    needs:
      - export-web
    strategy:
      fail-fast: true
      matrix:
        include:
          - artifact: web
            channel: html5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}
      - uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: ./build/${{ matrix.artifact }}
          itchUsername: ${{ secrets.USERNAME }}
          itchGameId: ${{ secrets.GAME_LINK }}
          buildChannel: ${{ matrix.channel }}